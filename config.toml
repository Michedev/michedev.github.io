######################## default configuration ####################
baseURL = "https://michedev.github.io/"
title = "Mikedev website"
theme = "port-hugo"

timeout = "300s" 
############################# Plugins ##############################
# The site loads one compiled stylesheet (assets/css/style.scss) and one
# vanilla-JS bundle (assets/js/script.js), which paints the solar-system
# backdrop and the post-it yarn. Fonts come from Google in <head>: Anton,
# Kalam, Caveat, Permanent Marker, Space Mono. The previous render-blocking CDN
# chain (Bootstrap, jQuery, FontAwesome Pro, hover.css, Waypoints, Rubik) was
# removed.


############################## navigation ###############################

# main menu
[[menu.main]]
name = "Home"
URL = "/"
weight = 1

[[menu.main]]
name = "About me"
URL = "/#about"
weight = 2


[[menu.main]]
name = "Posts"
URL = "/#posts"
weight = 3

[[menu.main]]
name = "Art gallery"
URL = "/art-gallery"
weight = 4


[[menu.main]]
name = "My Art Shop"
URL = "https://www.etsy.com/de-en/shop/MikedevPaint"
weight = 5
target = "_blank"




#################### default parameters ################################
[params]
logo_light = "images/logo.svg"
logo_dark = "images/logo-dark.svg"
enable_logo = false
copyright = "&copy; Michele De Vita"
# Meta data
description = "Personal Portfolio"
author = "Michele De Vita"
favicon = ""
# Set to your real GA4 measurement ID (e.g. "G-XXXXXXXXXX") to enable analytics.
# Left empty so no broken/placeholder tracking script is injected.
google_analytics = ""
timeout = "300s" # Increases timeout to 5 minutes

# Preloader (disabled: a full-page spinner delays content and hurts perceived load)
[params.preloader]
enable = false
preloader = "images/preloader.gif" # use jpg, png, svg or gif format.

############################# social site ########################

# icon picks the inline SVG in layouts/partials/social-icon.html;
# label is the accessible name announced for the link.
[[params.social]]
icon = "fab fa-github"
label = "GitHub"
link = "https://github.com/Michedev/"

[[params.social]]
icon = "fab fa-linkedin"
label = "LinkedIn"
link = "https://www.linkedin.com/in/michele-de-vita-582336bb/"

[[params.social]]
icon = "fas fa-envelope"
label = "Email"
link = "mailto:mik3dev@gmail.com"

contentDir = "content/english"
weight = 1
home = "Home"

[build]
  timeout = 60000  # Timeout in milliseconds (e.g., 60000ms = 60s)


[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block  = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]