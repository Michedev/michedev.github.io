########################### About ##################################
about:
  enable: true
  title: ''
  content: "Hi, I'm Michele. I'm a PhD candidate at FAU Erlangen-Nuremberg, and I work on AI safety which we can summarize in two modalities. 1) Try to understand when a data sample (from real-world scenario or model output) is never seen and potentially leading to failure and therefore to high costs (in literature is called _distribution shift detection_) or 2) certify reliable prediction from deep learning models using _uncertainty estimation_. I am currently collaborating with Mercedes and with Nokia for those topics. Thanks for stopping by, and feel free to say hi on [LinkedIn](https://www.linkedin.com/in/michele-de-vita-582336bb/), [Github](https://github.com/Michedev/), or by [email](mailto:mik3dev@gmail.com)."
  button:
    enable: true
    label: 'DOWNLOAD MY RESUME'
    link: https://github.com/Michedev/michedev.github.io/raw/hugo/CV_DeVita.pdf

